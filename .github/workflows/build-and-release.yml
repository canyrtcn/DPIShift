name: Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Single-EXE Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run build, test, and single-file EXE packaging
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64

      - name: Upload Release Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPIShift-win-x64
          path: |
            dist/DPIShift.exe
            dist/DPIShift-light.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DPIShift.exe
            dist/DPIShift-light.exe
            dist/SHA256SUMS.txt
