name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Single-EXE Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File Executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          dotnet publish src/DPIShift/DPIShift.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o artifacts/sc
          Copy-Item artifacts/sc/DPIShift.exe dist/DPIShift.exe -Force
          dotnet publish src/DPIShift/DPIShift.csproj -c Release -r win-x64 --no-self-contained -p:SelfContained=false -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o artifacts/light
          Copy-Item artifacts/light/DPIShift.exe dist/DPIShift-light.exe -Force

      - name: Upload Release Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPIShift-win-x64
          path: |
            dist/DPIShift.exe
            dist/DPIShift-light.exe

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DPIShift.exe
            dist/DPIShift-light.exe
